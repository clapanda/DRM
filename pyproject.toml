[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-requirement-maintenance"
version = "0.2.0"
description = "Deterministic, approval-gated DOCX requirement maintenance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
]
dependencies = [
  "python-docx>=1.1",
  "lxml>=5",
  "pydantic>=2.7",
]

[project.scripts]
drm = "drm.cli:main"

[project.urls]
Homepage = "https://github.com/clapanda/DRM"
Repository = "https://github.com/clapanda/DRM"
Issues = "https://github.com/clapanda/DRM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drm = ["profiles/*.json"]
